# LOCAL DEMO only. Production must use managed PostgreSQL/Redis/S3 and TLS ingress.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development_password}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d ragdb"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  minio:
    # MinIO's own images were removed from Docker Hub in 2026; this is a maintained build.
    image: cgr.dev/chainguard/minio:latest
    user: "0:0"  # demo only: lets the server write to the named volume
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ragminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ragminio_dev_secret}
      # Demo-only key so MinIO accepts the app's AES256 server-side encryption requests.
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:-rag-demo-key:n1AOntItK2nkrR2WGwr2QKt9DHWJ2EgvltjZpBk03A4=}
    volumes: [minio-data:/data]
    restart: unless-stopped
  minio-init:
    # Creates the demo bucket with the app image, so no separate client image is needed.
    build: .
    env_file: .env
    command:
      - python
      - -c
      - |
        import os, time, boto3
        from botocore.exceptions import ClientError
        s3 = boto3.client('s3', endpoint_url=os.environ['S3_ENDPOINT_URL'],
                          region_name=os.environ.get('S3_REGION', 'us-east-1'),
                          aws_access_key_id=os.environ['S3_ACCESS_KEY_ID'],
                          aws_secret_access_key=os.environ['S3_SECRET_ACCESS_KEY'])
        bucket = os.environ['S3_BUCKET']
        for attempt in range(60):
            try:
                s3.head_bucket(Bucket=bucket)
                break
            except ClientError as error:
                if error.response['Error']['Code'] in ('404', 'NoSuchBucket'):
                    s3.create_bucket(Bucket=bucket)
                    break
                time.sleep(2)
            except Exception:
                time.sleep(2)
        else:
            raise SystemExit('Object storage did not become ready')
        print('Bucket ready:', bucket)
    depends_on: [minio]
    restart: 'no'
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:8025:8025"]
    restart: unless-stopped
  migrations:
    build: .
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    restart: 'no'
  api:
    build: .
    env_file: .env
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    volumes: [cache-data:/app/data]
    depends_on:
      migrations: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  worker:
    build: .
    env_file: .env
    extra_hosts: ["host.docker.internal:host-gateway"]
    command: ["celery", "-A", "app.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=4", "--max-tasks-per-child=80"]
    volumes: [cache-data:/app/data]
    depends_on:
      migrations: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  beat:
    build: .
    env_file: .env
    command: ["celery", "-A", "app.celery_app:celery_app", "beat", "--loglevel=info", "--schedule=/app/data/celerybeat-schedule"]
    volumes: [cache-data:/app/data]
    depends_on:
      migrations: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
  minio-data:
  cache-data:
