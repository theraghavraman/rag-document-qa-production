# LOCAL DEMO only. Production must use managed PostgreSQL/Redis/S3 and TLS ingress.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development_password}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d ragdb"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ragminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ragminio_dev_secret}
    volumes: [minio-data:/data]
    restart: unless-stopped
  minio-init:
    image: minio/mc:latest
    entrypoint: ["/bin/sh", "-c"]
    command: ["until mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\"; do sleep 2; done; mc mb --ignore-existing local/rag-documents; mc anonymous set none local/rag-documents"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ragminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ragminio_dev_secret}
    depends_on: [minio]
    restart: 'no'
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:8025:8025"]
    restart: unless-stopped
  migrations:
    build: .
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    restart: 'no'
  api:
    build: .
    env_file: .env
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    volumes: [cache-data:/app/data]
    depends_on:
      migrations: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  worker:
    build: .
    env_file: .env
    extra_hosts: ["host.docker.internal:host-gateway"]
    command: ["celery", "-A", "app.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=4", "--max-tasks-per-child=80"]
    volumes: [cache-data:/app/data]
    depends_on:
      migrations: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  beat:
    build: .
    env_file: .env
    command: ["celery", "-A", "app.celery_app:celery_app", "beat", "--loglevel=info", "--schedule=/app/data/celerybeat-schedule"]
    volumes: [cache-data:/app/data]
    depends_on:
      migrations: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
  minio-data:
  cache-data:
